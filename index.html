<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고2 아침 공부 인증 챌린지</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="max-w-md mx-auto w-full min-h-screen bg-white shadow-lg flex flex-col relative overflow-hidden">
        
        <!-- HEADER -->
        <header class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center shadow-md">
            <div>
                <h1 class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-sun text-yellow-300"></i> 고2 아침 공부 챌린지
                </h1>
                <p id="headerUser" class="text-xs text-indigo-200 mt-0.5">로그인 필요</p>
            </div>
            <button onclick="logout()" class="cursor-pointer text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-full transition text-indigo-100 font-medium border border-indigo-500 z-20">
                <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
            </button>
        </header>

        <!-- TOP NAVIGATION TABS (Below Header) -->
        <nav id="topNav" class="hidden bg-white border-b border-slate-200 px-6 py-2.5 flex justify-around items-center shadow-xs">
            <button onclick="switchTab('record')" id="navRecordBtn" class="cursor-pointer flex items-center gap-2 text-indigo-600 font-bold transition px-4 py-2 rounded-xl bg-indigo-50">
                <i class="fa-solid fa-clipboard-user"></i>
                <span class="text-xs">나의 기록</span>
            </button>
            <button onclick="switchTab('feed')" id="navFeedBtn" class="cursor-pointer flex items-center gap-2 text-slate-500 hover:text-slate-700 font-medium transition px-4 py-2 rounded-xl">
                <i class="fa-solid fa-globe"></i>
                <span class="text-xs">우리 반 피드</span>
            </button>
        </nav>

        <!-- MAIN VIEW AREA -->
        <main class="flex-1 overflow-y-auto pb-10">

            <!-- VIEW 1: NICKNAME LOGIN SCREEN -->
            <section id="loginView" class="p-6 flex flex-col items-center justify-center min-h-[75vh]">
                <div class="w-full max-w-sm bg-gradient-to-br from-indigo-50 to-purple-50 p-8 rounded-2xl shadow-sm border border-indigo-100 text-center">
                    <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-md mb-4">
                        <i class="fa-solid fa-book-open-reader"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-900 mb-2">환영합니다!</h2>
                    <p class="text-sm text-slate-600 mb-6">아침 공부 인증을 위해 사용할<br>닉네임을 입력해 주세요.</p>
                    
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <div>
                            <input type="text" id="nicknameInput" required placeholder="닉네임을 입력하시오" 
                                class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center font-medium placeholder:text-slate-400 bg-white">
                        </div>
                        <button type="submit" class="cursor-pointer w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2">
                            <span>챌린지 시작하기</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </form>
                </div>
            </section>

            <!-- VIEW 2: MAIN DASHBOARD & TABS -->
            <section id="dashboardView" class="hidden flex flex-col h-full">
                
                <!-- USER SUMMARY STAT CARD -->
                <div class="p-5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white mx-4 mt-4 rounded-2xl shadow-md flex items-center justify-between">
                    <div>
                        <span class="text-xs uppercase tracking-wider text-indigo-200 font-semibold">현재 닉네임</span>
                        <h3 id="displayNickname" class="text-lg font-bold">--</h3>
                    </div>
                    <div class="text-right bg-white/10 px-4 py-2 rounded-xl backdrop-blur-sm border border-white/20">
                        <span class="text-xs text-indigo-100 block">누적 공부 일수</span>
                        <span id="displayStreak" class="text-2xl font-black text-yellow-300">0일</span>
                    </div>
                </div>

                <!-- TABS CONTENT CONTAINER -->
                <div class="p-4 flex-1">
                    
                    <!-- TAB 1: MY RECORD -->
                    <div id="tabMyRecord" class="space-y-5">
                        
                        <!-- UNIFIED VERIFICATION FORM -->
                        <form onsubmit="submitUnifiedVerification(event)" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                            <h4 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                <i class="fa-solid fa-circle-check text-indigo-600"></i> 오늘의 아침 공부 인증
                            </h4>

                            <div id="authStatusBanner" class="hidden p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs flex items-center gap-2">
                                <i class="fa-solid fa-circle-check text-emerald-600 text-base"></i>
                                <span>오늘 이미 인증을 완료했습니다! 내일도 화이팅!</span>
                            </div>

                            <!-- Resolution Input -->
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5 flex items-center gap-1.5">
                                    <i class="fa-solid fa-bullseye text-indigo-600"></i> 오늘 나의 결심
                                </label>
                                <textarea id="resolutionInput" rows="2" required placeholder="오늘의 결심을 입력하세요"
                                    class="w-full p-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none placeholder:text-slate-400"></textarea>
                            </div>

                            <!-- Photo Verification Area -->
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5 flex items-center gap-1.5">
                                    <i class="fa-solid fa-camera-retro text-indigo-600"></i> 공부 인증 사진
                                </label>
                                
                                <!-- Image Preview Box -->
                                <div id="previewContainer" class="hidden relative w-full h-48 bg-slate-100 rounded-xl overflow-hidden border border-slate-300 flex items-center justify-center mb-3">
                                    <img id="imagePreview" src="" alt="인증 사진 미리보기" class="w-full h-full object-cover">
                                    <button type="button" onclick="clearPhoto()" class="cursor-pointer absolute top-2 right-2 bg-slate-900/70 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs hover:bg-slate-900">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <!-- Capture / Upload Buttons -->
                                <div id="uploadButtonBox" class="grid grid-cols-2 gap-3">
                                    <button type="button" onclick="openCameraModal()" class="cursor-pointer bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 py-3 px-4 rounded-xl text-center flex flex-col items-center justify-center gap-1 transition">
                                        <i class="fa-solid fa-camera text-lg"></i>
                                        <span class="text-xs font-semibold">카메라 촬영</span>
                                    </button>
                                    <label class="cursor-pointer bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 py-3 px-4 rounded-xl text-center flex flex-col items-center justify-center gap-1 transition">
                                        <i class="fa-solid fa-folder-open text-lg"></i>
                                        <span class="text-xs font-semibold">파일 등록</span>
                                        <input type="file" accept="image/*" id="fileInput" onchange="handleImageSelect(event)" class="hidden">
                                    </label>
                                </div>
                            </div>

                            <!-- Single Unified Submit Button -->
                            <button type="submit" id="submitAuthBtn" class="cursor-pointer w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white text-sm font-semibold py-3.5 rounded-xl transition shadow-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i>
                                <span>오늘의 인증 제출하기</span>
                            </button>
                        </form>
                    </div>

                    <!-- TAB 2: CLASS FEED -->
                    <div id="tabClassFeed" class="hidden space-y-4">
                        <div class="flex justify-between items-center mb-1">
                            <h4 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                <i class="fa-solid fa-users text-indigo-600"></i> 우리 반 실시간 인증 피드
                            </h4>
                            <button onclick="loadClassFeed()" class="cursor-pointer text-xs text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1">
                                <i class="fa-solid fa-rotate-right" id="refreshIcon"></i> 새로고침
                            </button>
                        </div>

                        <!-- Feed Container -->
                        <div id="feedList" class="space-y-4">
                            <div class="text-center py-10 text-slate-400 text-xs">
                                <i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i>
                                <p>피드를 불러오는 중입니다...</p>
                            </div>
                        </div>
                    </div>

                </div>

            </section>

        </main>

        <!-- CAMERA STREAM MODAL -->
        <div id="cameraModal" class="hidden fixed inset-0 bg-slate-900/90 z-50 flex flex-col items-center justify-center p-4">
            <div class="w-full max-w-sm bg-black rounded-2xl overflow-hidden flex flex-col relative shadow-2xl">
                <div class="relative w-full h-96 bg-black flex items-center justify-center">
                    <video id="cameraVideo" autoplay playsinline class="w-full h-full object-cover"></video>
                    <canvas id="cameraCanvas" class="hidden"></canvas>
                </div>
                <div class="p-4 bg-slate-900 flex justify-between items-center">
                    <button type="button" onclick="closeCameraModal()" class="cursor-pointer text-slate-300 hover:text-white px-4 py-2 text-xs font-semibold">
                        취소
                    </button>
                    <button type="button" onclick="captureCameraPhoto()" class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-full text-sm font-bold shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-camera"></i> 찰칵
                    </button>
                </div>
            </div>
        </div>

        <!-- NOTIFICATION TOAST -->
        <div id="toast" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg transition duration-300">
            알림 메시지
        </div>

        <!-- LOADING OVERLAY -->
        <div id="loadingOverlay" class="hidden absolute inset-0 bg-slate-900/60 z-50 flex flex-col items-center justify-center text-white backdrop-blur-xs">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-indigo-400"></i>
            <span id="loadingText" class="text-xs font-semibold">처리 중입니다...</span>
        </div>

    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // [선생님 안내]: Google Apps Script 배포 후 발급받은 웹 앱 URL을 아래 상수에 입력해주세요.
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyUTlEQXNl3Af3xV2e2WFFvaAMKuUSP8bOfRGAuQQCH76WMTQY8MrT2_jhduyTMFG_H/exec";

        let currentUser = null;
        let selectedBase64Image = null;
        let todayVerified = false;
        let mediaStream = null;

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', () => {
            const savedNickname = localStorage.getItem('morning_study_nickname');
            if (savedNickname) {
                currentUser = savedNickname;
                document.getElementById('nicknameInput').value = savedNickname;
                handleLoginDirectly(savedNickname);
            }
        });

        function handleLogin(event) {
            event.preventDefault();
            const nickname = document.getElementById('nicknameInput').value.trim();
            if (!nickname) return showToast('닉네임을 정확히 입력해주세요.');
            
            localStorage.setItem('morning_study_nickname', nickname);
            currentUser = nickname;
            handleLoginDirectly(nickname);
        }

        function handleLoginDirectly(nickname) {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            document.getElementById('topNav').classList.remove('hidden');
            document.getElementById('headerUser').innerText = `접속자: ${nickname}`;
            document.getElementById('displayNickname').innerText = nickname;

            fetchUserData(nickname);
            switchTab('record');
        }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('morning_study_nickname');
                currentUser = null;
                selectedBase64Image = null;
                todayVerified = false;

                document.getElementById('dashboardView').classList.add('hidden');
                document.getElementById('topNav').classList.add('hidden');
                document.getElementById('loginView').classList.remove('hidden');
                document.getElementById('headerUser').innerText = '로그인 필요';
                document.getElementById('nicknameInput').value = '';
                showToast('로그아웃되었습니다.');
            }
        }

        function switchTab(tabName) {
            const recordTab = document.getElementById('tabMyRecord');
            const feedTab = document.getElementById('tabClassFeed');
            const navRecordBtn = document.getElementById('navRecordBtn');
            const navFeedBtn = document.getElementById('navFeedBtn');

            if (tabName === 'record') {
                recordTab.classList.remove('hidden');
                feedTab.classList.add('hidden');
                navRecordBtn.className = "cursor-pointer flex items-center gap-2 text-indigo-600 font-bold transition px-4 py-2 rounded-xl bg-indigo-50";
                navFeedBtn.className = "cursor-pointer flex items-center gap-2 text-slate-500 hover:text-slate-700 font-medium transition px-4 py-2 rounded-xl";
            } else {
                recordTab.classList.add('hidden');
                feedTab.classList.remove('hidden');
                navFeedBtn.className = "cursor-pointer flex items-center gap-2 text-indigo-600 font-bold transition px-4 py-2 rounded-xl bg-indigo-50";
                navRecordBtn.className = "cursor-pointer flex items-center gap-2 text-slate-500 hover:text-slate-700 font-medium transition px-4 py-2 rounded-xl";
                loadClassFeed();
            }
        }

        async function openCameraModal() {
            const modal = document.getElementById('cameraModal');
            const video = document.getElementById('cameraVideo');
            modal.classList.remove('hidden');

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = mediaStream;
            } catch (err) {
                console.error(err);
                modal.classList.add('hidden');
                showToast('카메라 접근 권한이 거부되었거나 지원하지 않는 기기입니다.');
            }
        }

        function closeCameraModal() {
            const modal = document.getElementById('cameraModal');
            const video = document.getElementById('cameraVideo');
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            video.srcObject = null;
            modal.classList.add('hidden');
        }

        function captureCameraPhoto() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('cameraCanvas');
            const width = video.videoWidth || 640;
            const height = video.videoHeight || 480;

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, width, height);

            selectedBase64Image = canvas.toDataURL('image/jpeg', 0.8);
            
            document.getElementById('imagePreview').src = selectedBase64Image;
            document.getElementById('previewContainer').classList.remove('hidden');
            document.getElementById('uploadButtonBox').classList.add('hidden');

            closeCameraModal();
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;

                    if (width > height && width > maxDim) {
                        height *= maxDim / width;
                        width = maxDim;
                    } else if (height > maxDim) {
                        width *= maxDim / height;
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    selectedBase64Image = canvas.toDataURL('image/jpeg', 0.7);
                    
                    document.getElementById('imagePreview').src = selectedBase64Image;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('uploadButtonBox').classList.add('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearPhoto() {
            selectedBase64Image = null;
            document.getElementById('imagePreview').src = '';
            document.getElementById('previewContainer').classList.add('hidden');
            document.getElementById('uploadButtonBox').classList.remove('hidden');
            document.getElementById('fileInput').value = '';
        }

        function submitUnifiedVerification(event) {
            event.preventDefault();
            const resolutionText = document.getElementById('resolutionInput').value.trim();
            if (!resolutionText) return showToast('오늘의 결심을 입력해주세요.');
            if (!selectedBase64Image) return showToast('인증 사진을 촬영하거나 등록해주세요.');

            showLoading(true, '아침 공부 인증 전송 중...');

            callGASAPI({
                action: 'submitVerification',
                nickname: currentUser,
                resolution: resolutionText,
                image: selectedBase64Image
            }, response => {
                showLoading(false);
                if (response.status === 'success') {
                    todayVerified = true;
                    document.getElementById('authStatusBanner').classList.remove('hidden');
                    updateStreakDisplay(response.streak);
                    showToast('인증이 성공적으로 완료되었습니다!');
                } else {
                    showToast('인증 실패: ' + response.message);
                }
            });
        }

        function fetchUserData(nickname) {
            callGASAPI({
                action: 'getUserData',
                nickname: nickname
            }, response => {
                if (response.status === 'success') {
                    updateStreakDisplay(response.streak || 0);
                    if (response.resolution) {
                        document.getElementById('resolutionInput').value = response.resolution;
                    }
                    if (response.todayVerified) {
                        todayVerified = true;
                        document.getElementById('authStatusBanner').classList.remove('hidden');
                    }
                }
            });
        }

        function loadClassFeed() {
            const feedList = document.getElementById('feedList');
            feedList.innerHTML = `
                <div class="text-center py-10 text-slate-400 text-xs">
                    <i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i>
                    <p>피드를 불러오는 중입니다...</p>
                </div>
            `;

            callGASAPI({
                action: 'getClassFeed'
            }, response => {
                if (response.status === 'success' && response.feed) {
                    renderFeed(response.feed);
                } else {
                    feedList.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">피드를 불러오지 못했습니다.</div>`;
                }
            });
        }

        function renderFeed(items) {
            const feedList = document.getElementById('feedList');
            if (!items || items.length === 0) {
                feedList.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs bg-white rounded-2xl border border-slate-200">아직 등록된 인증 피드가 없습니다. 첫 번째로 인증해 보세요!</div>`;
                return;
            }

            feedList.innerHTML = items.map(item => {
                let imgTag = '';
                if (item.imageUrl) {
                    let directUrl = item.imageUrl;
                    
                    // Extract Google Drive File ID and format robustly for public viewing
                    let fileId = '';
                    if (directUrl.includes('id=')) {
                        const match = directUrl.match(/id=([a-zA-Z0-9_-]+)/);
                        if (match && match[1]) fileId = match[1];
                    } else if (directUrl.includes('/file/d/')) {
                        const match = directUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                        if (match && match[1]) fileId = match[1];
                    }
                    
                    if (fileId) {
                        directUrl = `https://lh3.googleusercontent.com/d/${fileId}=w1000`;
                    }

                    imgTag = `
                        <div class="w-full bg-slate-100 max-h-80 overflow-hidden flex items-center justify-center border-t border-slate-100">
                            <img src="${directUrl}" class="w-full object-cover max-h-80" alt="인증 사진" 
                                crossorigin="anonymous"
                                onerror="this.onerror=null; this.src='https://placehold.co/600x400/f1f5f9/94a3b8?text=Image+Load+Failed';">
                        </div>
                    `;
                }

                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-4">
                        <div class="p-4 flex items-center justify-between bg-slate-50/50">
                            <div class="flex items-center gap-2.5">
                                <div class="w-9 h-9 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-xs shadow-xs">
                                    ${item.nickname ? item.nickname.charAt(0) : '?'}
                                </div>
                                <div>
                                    <span class="font-bold text-slate-800 text-sm block">${escapeHtml(item.nickname || '익명')}</span>
                                    <span class="text-[10px] text-slate-400">${item.timestamp || ''}</span>
                                </div>
                            </div>
                            <span class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full border border-indigo-100">
                                🔥 누적 ${item.streak || 1}일
                            </span>
                        </div>
                        ${item.resolution ? `<div class="px-4 py-3 bg-white text-xs text-slate-700 font-medium flex items-start gap-2"><i class="fa-solid fa-quote-left text-indigo-400 text-sm mt-0.5"></i><span>${escapeHtml(item.resolution)}</span></div>` : ''}
                        ${imgTag}
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function updateStreakDisplay(streakCount) {
            document.getElementById('displayStreak').innerText = streakCount + '일';
        }

        function callGASAPI(payload, callback) {
            if (GAS_WEB_APP_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
                setTimeout(() => {
                    if (payload.action === 'getUserData') {
                        callback({ status: 'success', streak: 0, resolution: "", todayVerified: false });
                    } else if (payload.action === 'submitVerification') {
                        callback({ status: 'success', streak: 1 });
                    } else if (payload.action === 'getClassFeed') {
                        callback({
                            status: 'success',
                            feed: []
                        });
                    }
                }, 500);
                return;
            }

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => callback(data))
            .catch(err => {
                showLoading(false);
                showToast('통신 오류가 발생했습니다.');
                console.error(err);
            });
        }

        function showLoading(show, text = '처리 중입니다...') {
            const overlay = document.getElementById('loadingOverlay');
            document.getElementById('loadingText').innerText = text;
            if (show) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
